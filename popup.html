<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      background: #15202b;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 img { width: 20px; height: 20px; }
    p {
      font-size: 13px;
      color: #8899a6;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #1d9bf0;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1a8cd8; }
    button:active { background: #1579b5; }
    #status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
    .success { color: #00ba7c; }
    .error { color: #f4212e; }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> Tweet Image</h1>
  <p>Selecione um texto na página e clique no botão abaixo para converter em imagem e copiar para a área de transferência.</p>
  <button id="btn">Converter para imagem</button>
  <div id="status"></div>
  <script src="card-renderer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
